# golangci-lint v2 config. Every issue gates: `make verify` and CI's golangci-lint job run it for
# the host and for GOOS=windows. This client carries a bearer credential, and gosec is enabled
# for the same reason tokendrop-proxy enables it.
version: "2"
run:
  # The module's language version (go.mod's `go` directive). It is
  # 1.27, the same minor as the build toolchain (`toolchain go1.27.3`):
  # nothing imports pkg/ from outside, so a lower minimum bought nothing,
  # and the go directive also sets the binary's GODEBUG defaults, which a
  # 1.25 directive held at Go 1.25's. The toolchain line still moves on
  # its own for each patched release (govulncheck gates on stdlib CVEs).
  go: "1.27"
linters:
  enable:
    - gosec
    - misspell
    - unconvert
    - depguard
  settings:
    misspell:
      locale: US
    depguard:
      rules:
        # AGENTS.md invariant 8: pkg/ is the shared protocol implementation this repo owns and
        # hands to other clients by import. A pkg/ package importing the cmd/ wrapper would make
        # that impossible and is the one import-graph rule this repo actually has today.
        pkg-never-cmd:
          files: ["**/pkg/**"]
          deny:
            - pkg: github.com/jevlinai/jevlin-go/cmd/jevlin
              desc: "pkg/ must not import cmd/jevlin (AGENTS.md invariant 8): it is the shared protocol implementation, owned here and consumed elsewhere by import"
        # AGENTS.md import boundaries: internal/selfupdate is the release fetcher and verifier. It
        # never reaches the wrapper, and it holds no participant credential, so it imports neither
        # the key and authorization store nor the platform client.
        selfupdate-boundary:
          files: ["**/internal/selfupdate/**"]
          deny:
            - pkg: github.com/jevlinai/jevlin-go/cmd/jevlin
              desc: "internal/selfupdate must not import cmd/jevlin (AGENTS.md import boundaries)"
            - pkg: github.com/jevlinai/jevlin-go/pkg/auth
              desc: "internal/selfupdate holds no participant credential (AGENTS.md import boundaries)"
            - pkg: github.com/jevlinai/jevlin-go/pkg/platform
              desc: "internal/selfupdate holds no participant credential (AGENTS.md import boundaries)"
  exclusions:
    generated: lax
    presets:
      - std-error-handling
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jevlinai/jevlin-go
