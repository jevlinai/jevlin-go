default_permissions = "jevlin"  # jevlin agents install ("CONFIG"); was: default_permissions = "work"

# >>> jevlin agents install >>>
# Codex permission profile for jevlin's search: write access to its jevlin
# home; its network is the profile it extends, unchanged.
# Supported with Codex 0.158.0 or newer; older versions are not
# supported, and below 0.131 Codex refuses this file and does not start.
[permissions.jevlin]
extends = "work"

[permissions.jevlin.filesystem]
"HOME/intake" = "write"
"HOME/sessions" = "write"
"HOME/spool" = "write"
"HOME/state" = "write"
# <<< jevlin agents install <<<
[permissions.work]
extends = "base"

[permissions.base]
extends = ":workspace"

[permissions.base.network]
enabled = true
