default_permissions = "jevlin"  # jevlin agents install ("CONFIG"); was: default_permissions = "work"

# >>> jevlin agents install >>>
# Codex permission profile for jevlin's search: write access to its jevlin
# home and network access to the search hosts only, through Codex's proxy.
# Needs Codex 0.131.0 or newer: an older Codex refuses this file with
# "invalid type: map, expected a boolean" and does not start; remove
# this block, or upgrade Codex.
[features.network_proxy]
enabled = true

[permissions.jevlin]
extends = "work"

[permissions.jevlin.filesystem]
"HOME/intake" = "write"
"HOME/sessions" = "write"
"HOME/spool" = "write"
"HOME/state" = "write"

[permissions.jevlin.network]
enabled = true

[permissions.jevlin.network.domains]
"agents-v1.nyks.dev" = "allow"
"as.example.invalid" = "allow"
"router.example.invalid" = "allow"
# <<< jevlin agents install <<<
[permissions.work]
extends = ":workspace"

[permissions.work.filesystem]
"/home/u/src" = "write"
