default_permissions = "jevlin"  # jevlin agents install ("<HOME>/jevlin.toml"); was: default_permissions = ":workspace"
model = "gpt-5"

[permissions.jevlin]
extends = ":workspace"

[permissions.jevlin.filesystem]
"<HOME>/intake" = "write"
"<HOME>/sessions" = "write"
"<HOME>/spool" = "write"
"<HOME>/state" = "write"

[permissions.jevlin.network]
enabled = true

[permissions.jevlin.network.domains]
"agents-v1.nyks.dev" = "allow"
"as.example.invalid" = "allow"
"router.example.invalid" = "allow"
# <<< jevlin agents install <<<
