# >>> jevlin agents install >>>
# Lets jevlin's search reach the router and record its mining
# observation under your jevlin home. Without this, Codex's default
# sandbox blocks the write and searches earn nothing.
[sandbox_workspace_write]
network_access = true
writable_roots = ["/Users/u/.jevlin/intake", "/Users/u/.jevlin/sessions", "/Users/u/.jevlin/spool", "/Users/u/.jevlin/state"]

